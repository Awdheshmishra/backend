<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <table>
        <caption>Food Menu</caption>
        <tr>
            <th>Item &nbsp;</th>
            
            <th>Price</th>
        </tr>
        <tr>
            <td>frooti</td>
            <td>10</td>
        </tr>
        <tr>
            <td>samosa</td>
            <td>12</td>
        </tr>
        <tr>
            <td>pakodi </td>
            <td>15</td>
        </tr>
        <tr>
            <td>chips</td>
            <td>20</td>
        </tr>

        <tr>
            <td>biscuit</td>
            <td>15</td>
        </tr>
        <tr>
            <td>tea</td>
            <td>25</td>
        </tr>
    </table>

    <!-- colspan and rowspan -->
     <hr>

    <!-- input element -- used to create multiple form controls   there are multiple types of input that can be creates using type attribute -->
    <input type="text"><br><br>
    <input type="text" placeholder="enter your username"><br><br>
    <input type="password"><br><br>
    <input type="number" placeholder="number"><br><br>
    <input type="date"><br><br>
    <input type="color"><br><br>
    <input type="time"><br><br>
    <hr>



    
</body>
</html>
